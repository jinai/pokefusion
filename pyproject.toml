[project]
name = "pokefusion"
version = "2.0.0"
requires-python = "~=3.14.0"
dependencies = [
    "aiohttp>=3.14.3",
    "discord-py>=2.7.1",
    "fuzzywuzzy>=0.18.0",
    "levenshtein>=0.27.4",
    "peewee>=4.5.0",
    "pillow>=12.3.0",
    "scikit-image>=0.26.0",
    "tqdm>=4.70.0",
    "typer>=0.27.2",
    "tzdata>=2026.3",
    "unidecode>=1.4.0",
]

[project.scripts]
pokefusion = "pokefusion.cli.app:app"

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pokefusion"
module-root = ""
namespace = true

[tool.ruff]
line-length = 120
namespace-packages = ["pokefusion"]

[tool.ruff.lint]
extend-select = [
    "ARG",
    "E501",
    "G",
    "LOG",
    "PTH",
    "RET",
    "TID252",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"pokefusion/db/migrations/*.py" = ["ARG001"]

[tool.ruff.lint.pyflakes]
extend-generics = ["discord.ext.commands.Context"]
